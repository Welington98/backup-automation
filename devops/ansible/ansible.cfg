[defaults]
# Sem inventario padrao de proposito: o inventario e multi-cliente
# (inventory/<cliente>/hosts.yml) e deve ser sempre passado explicitamente
# via -i, para nunca rodar contra todos os clientes por engano.
# Veja inventory/README.md.
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
