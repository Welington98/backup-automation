---
# Cliente: Cliente Exemplo Ltda
# Inventario especifico do cliente para o backup-agent
# Localizacao: devops/ansible/inventory/cliente_exemplo/hosts.yml
#
# Uso:
#   export BW_SESSION=$(bw unlock --raw)
#   ansible-playbook -i inventory/cliente_exemplo/hosts.yml playbook.yml
#
# Autenticacao SSH (dois metodos demonstrados abaixo - use o que fizer
# sentido por host):
#   1. SENHA: ansible_password (requer "sshpass" instalado no control node)
#   2. CHAVE SSH (recomendado): ansible_ssh_private_key_file
#
# Segredos (senhas, RESTIC_PASSWORD, chaves AWS) vem do Vaultwarden da
# empresa via lookup (ver group_vars/cliente_exemplo.yml e README.md) -
# nunca em texto puro neste arquivo.

all:
  children:
    backup_clients:
      # Todos os hosts deste cliente que rodam o backup-agent
      hosts:

        # --- Exemplo com autenticacao por SENHA ---
        cliente-exemplo-srv-01:
          ansible_host: "192.168.10.10"
          ansible_port: 22
          ansible_user: "root"
          ansible_password: "{{ vault_srv_01_ssh_password }}"
          # Se o sudo do usuario tambem exigir senha (usuario nao-root):
          # ansible_become_password: "{{ vault_srv_01_become_password }}"

        # --- Exemplo com autenticacao por CHAVE SSH (recomendado) ---
        cliente-exemplo-srv-02:
          ansible_host: "192.168.10.11"
          ansible_port: 22
          ansible_user: "deploy"
          ansible_ssh_private_key_file: "~/.ssh/id_backup_agent_cliente_exemplo"

    # Grupo do cliente - agrega backup_clients e carrega as vars de
    # group_vars/cliente_exemplo.yml (mesmo nome do grupo = mesmo nome do arquivo)
    cliente_exemplo:
      children:
        backup_clients:

  vars:
    ansible_become: true
    ansible_become_method: sudo
    ansible_ssh_common_args: "-o ConnectTimeout=10 -o StrictHostKeyChecking=no"
