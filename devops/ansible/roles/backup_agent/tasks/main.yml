---
# Os campos vault_* de backup_agent_env vem de lookup('community.general.bitwarden', ...)
# em group_vars/<cliente>.yml. Se BW_SESSION nao estiver setado ou o vault
# do Vaultwarden estiver bloqueado, o Ansible falha exatamente na primeira
# vez que resolve backup_agent_env (aqui no assert abaixo), com um erro do
# `bw` tipo "Not logged in." ou "Vault is locked." - rode `bw login` e
# `export BW_SESSION=$(bw unlock --raw)` antes de tentar de novo.
- name: Falhar se segredos obrigatorios ainda estiverem com valor padrao
  assert:
    that:
      - backup_agent_env.RESTIC_PASSWORD != 'CHANGE_ME'
      - not (backup_agent_env.ENABLE_CLOUD_SYNC == 'true' and backup_agent_env.AWS_ACCESS_KEY_ID == 'CHANGE_ME')
      - not (backup_agent_env.ENABLE_CLOUD_SYNC == 'true' and backup_agent_env.AWS_SECRET_ACCESS_KEY == 'CHANGE_ME')
      - not (backup_agent_env.ENABLE_ZABBIX == 'true' and backup_agent_env.CLIENT_NAME == 'CHANGE_ME')
    fail_msg: >-
      Segredos nao definidos para {{ inventory_hostname }}. Confira se o
      item "backup-agent - {{ client_name | default('<cliente>') }}" existe
      no Vaultwarden com todos os campos customizados esperados (ver
      README.md do cliente em devops/ansible/inventory/<cliente>/).

- name: Habilitar repositorios adicionais (Zabbix / EPEL)
  ansible.builtin.import_tasks: setup-repos.yml

- name: Determinar pacotes a instalar via gerenciador nativo
  ansible.builtin.set_fact:
    # util-linux-core (Amazon Linux): fornece o 'flock' usado pelo
    # backup-agent.sh - nao vem pre-instalado em imagens minimas de Amazon
    # Linux, ao contrario de RHEL/Rocky/Alma/Debian/Ubuntu.
    backup_agent_packages: >-
      {{ (['restic'] if ansible_facts['distribution'] != 'Amazon' else ['bzip2', 'util-linux-core'])
         + ['zabbix-sender', 'curl', 'jq', 'openssl'] }}

- name: Instalar pacotes necessarios (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ backup_agent_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Instalar pacotes necessarios (RHEL/CentOS/Rocky/Alma/Amazon Linux)
  ansible.builtin.yum:
    name: "{{ backup_agent_packages }}"
    state: present
    # imagens minimas RHEL8+/Rocky/Alma/Amazon Linux trazem 'curl-minimal'
    # pre-instalado, que conflita com o pacote 'curl' completo - sem essa
    # flag o dnf aborta em vez de substituir (ver os/linux/install.sh).
    allowerasing: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Instalar restic via binario oficial (Amazon Linux - sem EPEL binario-compativel)
  ansible.builtin.shell: |
    set -euo pipefail
    arch_suffix="amd64"
    [ "{{ ansible_architecture }}" = "aarch64" ] && arch_suffix="arm64"
    curl -fsSL -o /tmp/restic.bz2 "https://github.com/restic/restic/releases/download/\
    v{{ backup_agent_restic_version }}/restic_{{ backup_agent_restic_version }}_linux_${arch_suffix}.bz2"
    bzip2 -d -f /tmp/restic.bz2
    install -m 755 /tmp/restic /usr/local/bin/restic
  args:
    creates: /usr/local/bin/restic
    executable: /bin/bash
  when: ansible_facts['distribution'] == 'Amazon'

- name: Criar diretorio de configuracao e certs
  file:
    path: "{{ backup_agent_config_dir }}/certs"
    state: directory
    mode: "0700"

- name: Copiar script principal
  copy:
    src: "{{ role_path }}/../../../../os/linux/backup-agent.sh"
    dest: "{{ backup_agent_bin_dir }}/backup-agent.sh"
    mode: "0750"

- name: Copiar script de geracao de PSK
  copy:
    src: "{{ role_path }}/../../../../os/linux/generate-psk.sh"
    dest: "{{ backup_agent_bin_dir }}/backup-agent-generate-psk.sh"
    mode: "0750"

- name: Copiar script de cadastro automatico no Zabbix (via API)
  copy:
    src: "{{ role_path }}/../../../../os/linux/zabbix-register.sh"
    dest: "{{ backup_agent_bin_dir }}/backup-agent-zabbix-register.sh"
    mode: "0750"

- name: Copiar lista de exclusoes
  copy:
    src: "{{ role_path }}/../../../../os/linux/excludes.txt"
    dest: "{{ backup_agent_config_dir }}/excludes.txt"
    mode: "0644"

- name: Gerar backup.env a partir do template
  template:
    src: templates/backup.env.j2
    dest: "{{ backup_agent_config_dir }}/backup.env"
    mode: "0600"
  no_log: true

- name: Gerar PSK do Zabbix (se habilitado e ainda nao existir)
  command: "{{ backup_agent_bin_dir }}/backup-agent-generate-psk.sh"
  args:
    creates: "{{ backup_agent_env.ZABBIX_TLS_PSK_FILE }}"
  when: backup_agent_env.ENABLE_ZABBIX_TLS | default('false') == 'true'
  register: backup_agent_psk_result
  changed_when: "'SUCCESS' in backup_agent_psk_result.stdout"
  no_log: true

- name: Avisar que a PSK precisa ser cadastrada manualmente no Zabbix Server
  # Nao usa 'debug: msg: psk_result.stdout_lines' de proposito - a task
  # anterior tem no_log: true (a PSK nao pode vazar pro log/console do
  # Ansible/CI), e isso tambem censura o valor pra qualquer task seguinte
  # que tente exibi-lo. Por isso aqui so orientamos a ler o valor direto no
  # host (unico lugar onde ele deveria aparecer em texto claro).
  debug:
    msg: >-
      PSK gerada em {{ backup_agent_env.ZABBIX_TLS_PSK_FILE }} no host
      {{ inventory_hostname }}. Leia o valor direto no host (nunca via
      log do Ansible): ssh {{ inventory_hostname }} sudo cat
      {{ backup_agent_env.ZABBIX_TLS_PSK_FILE }} - depois cadastre em
      Zabbix Server > Hosts > {{ backup_agent_env.ZABBIX_HOSTNAME }} >
      Encryption (identity: {{ backup_agent_env.ZABBIX_TLS_PSK_IDENTITY }}).
  when:
    - backup_agent_env.ENABLE_ZABBIX_TLS | default('false') == 'true'
    - not backup_agent_env.ZABBIX_API_TOKEN | default('')

- name: Cadastrar host no Zabbix Server via API (se ZABBIX_API_URL/TOKEN estiverem definidos)
  command: "{{ backup_agent_bin_dir }}/backup-agent-zabbix-register.sh"
  when:
    - backup_agent_env.ENABLE_ZABBIX | default('false') == 'true'
    - backup_agent_env.ZABBIX_API_URL | default('')
    - backup_agent_env.ZABBIX_API_TOKEN | default('')
  register: backup_agent_zabbix_register_result
  changed_when: >-
    'criado' in backup_agent_zabbix_register_result.stdout or
    'atualizado' in backup_agent_zabbix_register_result.stdout
  no_log: true

- name: Agendar execucao diaria via cron
  cron:
    name: "backup-agent daily run"
    minute: "{{ backup_agent_cron_minute }}"
    hour: "{{ backup_agent_cron_hour }}"
    job: "{{ backup_agent_bin_dir }}/backup-agent.sh > /dev/null 2>&1"
    user: root

- name: Agendar verificacao de integridade (restic check) semanal via cron
  cron:
    name: "backup-agent integrity check"
    minute: "{{ backup_agent_check_cron_minute }}"
    hour: "{{ backup_agent_check_cron_hour }}"
    weekday: "{{ backup_agent_check_cron_weekday }}"
    job: "{{ backup_agent_bin_dir }}/backup-agent.sh check > /dev/null 2>&1"
    user: root

- name: Garantir que o servico de cron esteja habilitado e iniciado
  ansible.builtin.service:
    name: "{{ 'cron' if ansible_facts['os_family'] == 'Debian' else 'crond' }}"
    state: started
    enabled: true
