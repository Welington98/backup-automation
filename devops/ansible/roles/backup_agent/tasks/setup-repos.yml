---
# Habilita os repositorios adicionais necessarios para 'restic' e
# 'zabbix-sender' fora do Debian/Ubuntu, espelhando a logica de
# os/linux/install.sh (detect_os/prepare_repos):
#   - RHEL/CentOS/Rocky/Alma: EPEL (restic) + repositorio oficial do Zabbix.
#   - Amazon Linux: sem EPEL (a AWS nao mantem build binario-compativel com
#     o AL2023, e o EPEL7 usado no AL2 esta sem atualizacoes de seguranca
#     desde 06/2024) - so o repositorio oficial do Zabbix. O restic e
#     instalado via binario oficial do GitHub em main.yml, DEPOIS da
#     instalacao de pacotes (precisa de 'curl', que ainda nao existe neste
#     ponto do playbook) - ver task "Instalar restic via binario oficial".

- name: Determinar major version do SO (familia RedHat/Amazon)
  ansible.builtin.set_fact:
    backup_agent_os_major: "{{ ansible_distribution_major_version }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Habilitar EPEL (RHEL/CentOS/Rocky/Alma - nao usado no Amazon Linux)
  ansible.builtin.yum:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ backup_agent_os_major }}.noarch.rpm"
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Amazon'

- name: Habilitar repositorio oficial do Zabbix (RHEL/CentOS/Rocky/Alma)
  ansible.builtin.yum:
    name: "https://repo.zabbix.com/zabbix/{{ backup_agent_zabbix_repo_version }}/rhel/\
{{ backup_agent_os_major }}/{{ ansible_architecture }}/zabbix-release-latest-\
{{ backup_agent_zabbix_repo_version }}.el{{ backup_agent_os_major }}.noarch.rpm"
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Amazon'

- name: Habilitar repositorio oficial do Zabbix (Amazon Linux)
  ansible.builtin.yum:
    name: "https://repo.zabbix.com/zabbix/{{ backup_agent_zabbix_repo_version }}/amazonlinux/\
{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/zabbix-release-latest-\
{{ backup_agent_zabbix_repo_version }}.amzn{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
  when: ansible_facts['distribution'] == 'Amazon'
